<?xml version="1.0" encoding="UTF-8"?>
<!-- Newspaper icon for isotope-viewer (the article and file browser). 512x512, no text glyphs
     (the masthead and columns are drawn as shapes) so it renders identically everywhere. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27527a"/>
      <stop offset="1" stop-color="#0d2238"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eee3c9"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb1c9"/>
      <stop offset="1" stop-color="#2d6a86"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tileclip"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <g clip-path="url(#tileclip)">
    <ellipse cx="150" cy="40" rx="330" ry="170" fill="#ffffff" opacity="0.07"/>
  </g>

  <!-- back sheet (a second newspaper underneath, peeking out) -->
  <g transform="rotate(7 262 262)" filter="url(#shadow)">
    <rect x="124" y="82" width="270" height="352" rx="14" fill="#d9ccaa"/>
    <rect x="144" y="108" width="230" height="10" rx="3" fill="#b9a97e"/>
    <rect x="144" y="130" width="230" height="10" rx="3" fill="#b9a97e"/>
  </g>

  <!-- front sheet -->
  <g transform="rotate(-5 250 262)" filter="url(#shadow)">
    <rect x="98" y="64" width="290" height="384" rx="16" fill="url(#paper)"/>

    <!-- masthead -->
    <rect x="116" y="84" width="254" height="56" rx="6" fill="#1b1b1f"/>
    <rect x="156" y="98" width="174" height="14" rx="5" fill="#f6efe0"/>
    <rect x="186" y="118" width="114" height="8" rx="4" fill="#f6efe0" opacity="0.75"/>
    <circle cx="136" cy="112" r="7" fill="#f6efe0"/>
    <circle cx="350" cy="112" r="7" fill="#f6efe0"/>
    <rect x="116" y="148" width="254" height="3" fill="#1b1b1f"/>
    <rect x="116" y="155" width="254" height="1.5" fill="#1b1b1f"/>

    <!-- headline -->
    <rect x="116" y="170" width="232" height="19" rx="3" fill="#1b1b1f"/>
    <rect x="116" y="196" width="168" height="19" rx="3" fill="#1b1b1f"/>

    <!-- photo -->
    <rect x="116" y="228" width="108" height="86" rx="4" fill="url(#photo)"/>
    <circle cx="196" cy="252" r="10" fill="#fbe9a6"/>
    <path d="M116 314 L152 266 L174 292 L190 276 L224 314 Z" fill="#1d4a60"/>
    <path d="M116 314 L140 286 L158 314 Z" fill="#2c6580"/>
    <rect x="116" y="320" width="108" height="5" rx="2" fill="#8c8571"/>
    <rect x="116" y="330" width="78" height="5" rx="2" fill="#8c8571"/>

    <!-- text column beside the photo -->
    <g fill="#7a7566">
      <rect x="236" y="230" width="134" height="6" rx="2"/><rect x="236" y="244" width="134" height="6" rx="2"/>
      <rect x="236" y="258" width="120" height="6" rx="2"/><rect x="236" y="272" width="134" height="6" rx="2"/>
      <rect x="236" y="286" width="134" height="6" rx="2"/><rect x="236" y="300" width="104" height="6" rx="2"/>
      <rect x="236" y="314" width="134" height="6" rx="2"/><rect x="236" y="328" width="92" height="6" rx="2"/>
    </g>

    <!-- lower columns -->
    <rect x="116" y="349" width="254" height="2" fill="#1b1b1f" opacity="0.6"/>
    <g fill="#7a7566">
      <rect x="116" y="362" width="116" height="6" rx="2"/><rect x="116" y="376" width="116" height="6" rx="2"/>
      <rect x="116" y="390" width="100" height="6" rx="2"/><rect x="116" y="404" width="116" height="6" rx="2"/>
      <rect x="254" y="362" width="116" height="6" rx="2"/><rect x="254" y="376" width="104" height="6" rx="2"/>
      <rect x="254" y="390" width="116" height="6" rx="2"/><rect x="254" y="404" width="84" height="6" rx="2"/>
    </g>
  </g>

  <!-- NNTP badge: three connected nodes (a news network) -->
  <g filter="url(#shadow)">
    <circle cx="404" cy="404" r="76" fill="#f2a31b"/>
    <circle cx="404" cy="404" r="76" fill="none" stroke="#ffd37a" stroke-width="5" opacity="0.8"/>
  </g>
  <g stroke="#fffaf0" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M404 374 L374 430"/><path d="M404 374 L434 430"/><path d="M374 430 L434 430"/>
  </g>
  <g fill="#fffaf0">
    <circle cx="404" cy="372" r="15"/><circle cx="372" cy="430" r="15"/><circle cx="436" cy="430" r="15"/>
  </g>
  <g fill="#c77f06">
    <circle cx="404" cy="372" r="6"/><circle cx="372" cy="430" r="6"/><circle cx="436" cy="430" r="6"/>
  </g>
</svg>
